name: ci

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  gate:
    name: fmt, clippy, test, doc, deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, cargo-deny and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked --force cargo-deny --version "${CARGO_DENY_VERSION}"
          fi

      - name: Format
        run: timeout 600 cargo fmt --all -- --check

      - name: Clippy
        run: timeout 600 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: timeout 900 cargo test --workspace --all-features --locked

      - name: Check nftables goldens without tunnel links
        run: |
          if ! command -v nft >/dev/null; then
            sudo timeout 300 apt-get update
            sudo timeout 300 apt-get install -y nftables
          fi
          mapfile -d '' files < <(find crates/*/tests/golden -type f \( -name '*.nft' -o -name '*.golden' \) -print0 | sort -z)
          (( ${#files[@]} >= 2 ))
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
            sudo timeout 30 unshare --net -- nft -c -f "$f"
          done

      - name: Doc
        run: timeout 600 cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Dependency policy
        run: timeout 600 cargo deny check

      - name: Default-feature build
        run: timeout 600 cargo build --workspace --locked

  musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and musl target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-musl

      - name: Install musl toolchain
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build musl release
        run: cargo build -p scupper --bin scupper --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Verify static x86-64 executable
        run: |
          description=$(file target/x86_64-unknown-linux-musl/release/scupper)
          printf '%s\n' "$description"
          [[ "$description" == *'ELF 64-bit LSB'* && "$description" == *'x86-64'* ]]
          [[ "$description" == *'statically linked'* || "$description" == *'static-pie linked'* ]]

      - uses: actions/upload-artifact@v4
        with:
          name: scupper-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/scupper
          retention-days: 14
          if-no-files-found: error

  lab:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    needs: musl
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install lab tools
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 util-linux curl iptables tcpdump iputils-ping

      - uses: actions/download-artifact@v4
        with:
          name: scupper-x86_64-linux-musl
          path: lab-bin

      - name: Check nftables goldens without tunnel links
        run: |
          mapfile -d '' files < <(find crates/*/tests/golden -type f \( -name '*.nft' -o -name '*.golden' \) -print0 | sort -z)
          (( ${#files[@]} >= 2 ))
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
            sudo timeout 30 unshare --net -- nft -c -f "$f"
          done

      - name: Run namespace lab
        run: |
          chmod +x lab-bin/scupper
          timeout 900 sudo lab/run.sh "$PWD/lab-bin/scupper" "$PWD/lab-captures"

      - name: Record nftables service behavior (V-23)
        run: timeout --kill-after=10 300 sudo lab/v23.sh "$PWD/lab-captures"

      - name: Record networkd behavior (V-24)
        run: timeout --kill-after=10 180 sudo lab/v24.sh "$PWD/lab-captures"

      - name: Print lab results
        if: always()
        run: |
          for report in results v23 v24; do
            echo "${report}.tsv"
            if [[ -f "lab-captures/${report}.tsv" ]]; then
              cat "lab-captures/${report}.tsv"
            else
              echo 'Report unavailable: the corresponding step did not complete.'
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-captures-${{ matrix.runner }}
          path: lab-captures
          retention-days: 14
          if-no-files-found: warn
