name: ci

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_TMPDIR: ${{ github.workspace }}/target/tmp
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # Lab branches also run native qualification; the full gate runs locally
  # before every lab push and again in CI on main.
  gate:
    name: fmt, clippy, test, doc, deny
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, cargo-deny and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked --force cargo-deny --version "${CARGO_DENY_VERSION}"
          fi

      - name: Format
        run: timeout 600 cargo fmt --all -- --check

      - name: Clippy
        run: timeout 600 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Darwin cross-target lint
        run: |
          rustup target add aarch64-apple-darwin
          timeout 600 cargo clippy --target aarch64-apple-darwin -p scupper-darwin -p scupper-mac --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: timeout 600 cargo test --workspace --all-features --locked

      - name: Check nftables goldens without tunnel links
        run: |
          if ! command -v nft >/dev/null; then
            sudo timeout 300 apt-get update
            sudo timeout 300 apt-get install -y nftables
          fi
          mapfile -d '' files < <(find crates/*/tests/golden -type f \( -name '*.nft' -o -name '*.golden' \) -print0 | sort -z)
          (( ${#files[@]} >= 2 ))
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
            sudo timeout 30 unshare --net -- nft -c -f "$f"
          done

      - name: Doc
        run: timeout 600 cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Dependency policy
        run: timeout 600 cargo deny check

      - name: Default-feature build
        run: timeout 600 cargo build --workspace --locked

  production:
    name: shipped startup without testing feature
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy without testing
        run: timeout 600 cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests without testing
        run: timeout 600 cargo test --workspace --lib --bins --locked
      - name: Default-feature integration fencing
        run: |
          timeout 600 cargo test -p xtask --test mutation --locked
          timeout 600 cargo test -p scupper --test mutation --locked
          timeout 600 cargo test -p scupper-core --test verdict_v2 --locked default_build
      - name: Reject release mutation feature
        run: |
          if timeout 600 cargo build --release -p scupper-core --features lab-mutation --locked > release-mutation.log 2>&1; then
            cat release-mutation.log
            exit 1
          else
            release_status=$?
            cat release-mutation.log
            test "$release_status" -eq 101
            grep -Fq 'error: lab-mutation is restricted to debug lab builds' release-mutation.log
          fi
      - name: Release CLI and daemon
        run: timeout 600 cargo build -p scupper -p scupperd --release --locked
      - name: Verify testing hooks absent from release artifacts
        run: |
          for binary in scupper scupperd; do
            if grep -aEq 'SCUPPER_TEST_BOOT_POINT|SCUPPER_TEST_CA_DER|SCUPPER_TEST_ALERT_WINDOW_SECONDS|SCUPPER_LAB_MUTATION|injected boot stop|unknown-inventory-once' target/release/$binary; then
              echo "testing hook found in release $binary"
              exit 1
            fi
          done

  musl:
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and musl target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-musl

      - name: Install musl toolchain
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build musl release
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo xtask dist --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Verify static x86-64 executable
        run: |
          for binary in scupper scupperd; do
          description=$(file target/x86_64-unknown-linux-musl/release/$binary)
          printf '%s\n' "$description"
          [[ "$description" == *'ELF 64-bit LSB'* && "$description" == *'x86-64'* ]]
          [[ "$description" == *'statically linked'* || "$description" == *'static-pie linked'* ]]
            if grep -aEq 'SCUPPER_TEST_BOOT_POINT|SCUPPER_TEST_CA_DER|SCUPPER_TEST_ALERT_WINDOW_SECONDS|SCUPPER_LAB_MUTATION|injected boot stop|unknown-inventory-once' target/x86_64-unknown-linux-musl/release/$binary; then
              echo "testing hook found in musl $binary"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scupper-x86_64-linux-musl
          path: |
            dist/scupper-*-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: 1
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: env -u CARGO_TARGET_TMPDIR cargo fmt --all -- --check
      - name: Clippy portable CLI and release tooling
        run: env -u CARGO_TARGET_TMPDIR cargo clippy -p scupper -p scupper-core -p scupper-proto -p scupper-mac -p xtask --all-targets --locked -- -D warnings
      - name: Portable tests
        timeout-minutes: 15
        run: env -u CARGO_TARGET_TMPDIR cargo test -p scupper -p scupper-core -p scupper-proto -p scupper-mac -p xtask --locked
      - name: Build CLI archive
        run: env -u CARGO_TARGET_TMPDIR cargo xtask dist --target aarch64-apple-darwin
      - name: Verify version commands
        run: |
          for argument in version --version; do
            output=$(target/aarch64-apple-darwin/release/scupper "$argument")
            printf '%s\n' "$output"
            [[ "$output" =~ ^scupper\ [0-9] ]]
          done
      - uses: actions/upload-artifact@v4
        with:
          name: scupper-aarch64-apple-darwin
          path: |
            dist/scupper-*-aarch64-apple-darwin.tar.gz
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  macos-native:
    defaults:
      run:
        shell: bash
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/lab/') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
        group: [smoke, probe, probe-hijack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.group == 'probe-hijack' }}
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo and native target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: native-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-go@v5
        if: matrix.group != 'smoke'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build pinned upstream wireguard-go
        if: matrix.group != 'smoke'
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p qual-out target/qualification
          python3 - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          pin = json.loads(Path('crates/scupper-mac/qualification/wireguard-go.json').read_text())
          scratch = tempfile.TemporaryDirectory(prefix='wireguard-go-', dir='target/qualification')
          source = Path(scratch.name) / 'source'
          subprocess.run(['git', 'clone', '--depth=1', '--branch', pin['tag'], pin['repository'], str(source)], check=True)
          commit = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          if commit != pin['commit']:
              raise SystemExit('wireguard-go tag commit differs from reviewed pin')
          version = subprocess.check_output(['go', 'version'], text=True).strip()
          if ('go' + pin['go'] + ' ') not in version:
              raise SystemExit('Go version differs from qualification pin')
          pin.update(observed_commit=commit, go_version=version)
          Path('qual-out/wireguard-build.json').write_text(json.dumps(pin, indent=2) + '\n')
          subprocess.run(['go', 'build', '-trimpath', '-o', str(Path('qual-out/wireguard-go').resolve()), '.'], cwd=source, check=True)
          scratch.cleanup()
          PY
          shasum -a 256 qual-out/wireguard-go | tee qual-out/wireguard-sha256.txt
          go version -m qual-out/wireguard-go | tee qual-out/wireguard-build-info.txt
      - name: Build qualification harness as runner user
        timeout-minutes: 8
        run: |
          python3 crates/scupper-mac/qualification/test_artifacts.py
          mkdir -p qual-out
          rm -f target/debug/scupper-mac-qual
          rustc -Vv | tee qual-out/rustc.txt
          env -u CARGO_TARGET_TMPDIR cargo build -p scupper-mac --bin scupper-mac-qual --features qualification --locked 2>&1 | tee qual-out/build.log
          shasum -a 256 target/debug/scupper-mac-qual | tee qual-out/built-harness-sha256.txt
      - name: Native lint and tests of the FFI crate
        timeout-minutes: 8
        run: |
          env -u CARGO_TARGET_TMPDIR cargo clippy -p scupper-darwin --all-targets --locked -- -D warnings
          env -u CARGO_TARGET_TMPDIR cargo test -p scupper-darwin --locked
      - name: Compile SDK ABI probe
        timeout-minutes: 2
        run: |
          cc -std=c11 -Wall -Wextra -Werror -v crates/scupper-darwin/probe/abi.c -o qual-out/abi-probe 2>&1 | tee qual-out/abi-build.log
          qual-out/abi-probe | tee qual-out/abi-sdk.json
      - name: Compile capability probes with full diagnostics
        if: matrix.group != 'smoke'
        timeout-minutes: 2
        run: |
          for source in crates/scupper-mac/qualification/probes/*.c; do
            name=$(basename "$source" .c)
            cc -std=c11 -Wall -Wextra -Werror -v "$source" -framework SystemConfiguration -framework CoreFoundation -o "qual-out/probe-$name" 2>&1 | tee "qual-out/$name-build.log"
          done
          shasum -a 256 qual-out/probe-* | tee qual-out/built-capability-sha256.txt
      - name: Stage root-owned qualification files
        timeout-minutes: 1
        run: |
          # Fail closed on an existing path; never install through a planted link.
          test ! -e /private/var/db/scupper-qual
          test ! -L /private/var/db/scupper-qual
          /usr/bin/sudo /usr/bin/install -d -o root -g wheel -m 0700 /private/var/db/scupper-qual
          /usr/bin/sudo /usr/bin/install -o root -g wheel -m 0755 target/debug/scupper-mac-qual /private/var/db/scupper-qual/scupper-mac-qual
          /usr/bin/sudo /usr/bin/install -o root -g wheel -m 0755 qual-out/abi-probe /private/var/db/scupper-qual/abi-probe
          for binary in qual-out/probe-* qual-out/wireguard-go; do
            if [ -f "$binary" ]; then
              /usr/bin/sudo /usr/bin/install -o root -g wheel -m 0755 "$binary" "/private/var/db/scupper-qual/$(basename "$binary")"
              /usr/bin/sudo /usr/bin/shasum -a 256 "/private/var/db/scupper-qual/$(basename "$binary")" >> qual-out/executed-capability-sha256.txt
            fi
          done
          /usr/bin/sudo /usr/bin/shasum -a 256 /private/var/db/scupper-qual/scupper-mac-qual | tee qual-out/executed-harness-sha256.txt
          /usr/bin/sudo /usr/bin/shasum -a 256 /private/var/db/scupper-qual/abi-probe | tee qual-out/executed-probe-sha256.txt
          test "$(cut -d ' ' -f 1 qual-out/built-harness-sha256.txt)" = "$(cut -d ' ' -f 1 qual-out/executed-harness-sha256.txt)"
      - name: Preflight
        timeout-minutes: 3
        run: /usr/bin/sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS,ImageVersion,RUNNER_NAME,GITHUB_RUN_ID,GITHUB_SHA /private/var/db/scupper-qual/scupper-mac-qual preflight --out /private/var/db/scupper-qual/evidence --disposable-runner
      - name: Arm independent launchd restore
        timeout-minutes: 1
        run: |
          after=1080
          if [ '${{ matrix.group }}' = probe-hijack ]; then after=10; fi
          /usr/bin/sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /private/var/db/scupper-qual/scupper-mac-qual arm --after "$after" --out /private/var/db/scupper-qual/evidence --disposable-runner
      - name: Run qualification cell
        timeout-minutes: 18
        run: /usr/bin/sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS,ImageVersion,RUNNER_NAME,GITHUB_RUN_ID,GITHUB_SHA /private/var/db/scupper-qual/scupper-mac-qual run --group ${{ matrix.group }} --out /private/var/db/scupper-qual/evidence --disposable-runner
      - name: Restore and stop dead-man
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p qual-out
          restore_status=0
          if /usr/bin/sudo /bin/test -f /private/var/db/scupper-qual/evidence/preflight.json && /usr/bin/sudo /bin/test -x /private/var/db/scupper-qual/scupper-mac-qual; then
            /usr/bin/sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /private/var/db/scupper-qual/scupper-mac-qual restore --out /private/var/db/scupper-qual/evidence --disposable-runner || restore_status=$?
          fi
          if /usr/bin/sudo /bin/test -f /private/var/db/scupper-qual/evidence/restored.json; then
            /usr/bin/sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /private/var/db/scupper-qual/scupper-mac-qual restore --out /private/var/db/scupper-qual/evidence --disposable-runner || restore_status=$?
          fi
          # Redirections are opened by the runner, never by a privileged process.
          /usr/bin/sudo /bin/launchctl print system/net.scupper.qual.restore > qual-out/deadman-final-status.log 2>&1 || true
          /usr/bin/sudo /bin/launchctl bootout system/net.scupper.qual.restore > qual-out/deadman-bootout.log 2>&1 || cat qual-out/deadman-bootout.log
          if /usr/bin/sudo /bin/launchctl print system/net.scupper.qual.restore > qual-out/deadman-after-bootout.log 2>&1; then
            cat qual-out/deadman-after-bootout.log
            restore_status=1
          fi
          # Export only after the worker is gone. Root only reads its protected
          # evidence; the unprivileged tar creates the artifact files.
          if /usr/bin/sudo /bin/test -d /private/var/db/scupper-qual/evidence; then
            /usr/bin/sudo /usr/bin/tar --exclude=storage.dmg --exclude=storage-mount --exclude=scratch-sleep --exclude=renamed-sleep --exclude=hard-sleep -C /private/var/db/scupper-qual/evidence -cf - . | tar --no-same-owner -C qual-out -xf -
          fi
          exit "$restore_status"
      - name: Check artifact redaction and executable identity
        if: always()
        run: python3 crates/scupper-mac/qualification/check-artifacts.py qual-out
      - name: Summarize verdicts
        if: always()
        env:
          QUAL_RUNNER: ${{ matrix.runner }}
          QUAL_GROUP: ${{ matrix.group }}
        run: python3 crates/scupper-mac/qualification/check-artifacts.py qual-out --summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-${{ matrix.runner }}-${{ matrix.group }}
          path: qual-out
          retention-days: 14
          if-no-files-found: error

  leaktest:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install leak lab tools
        run: |
          # conntrack is required by boot when rebuilding an existing namespace.
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns openssl python3

      - name: Check shard budget using built-in duration estimates
        run: timeout 600 cargo test -p xtask --lib ci_shard_budget_uses_builtin_estimates_and_rejects_over_budget --locked

      - name: Build namespace lab
        run: timeout 600 cargo build -p xtask --release --locked

      - name: Build boot, check and probe testing CLI
        run: timeout 600 cargo build -p scupper -p scupperd --features testing --locked

      - name: Run boot-built namespace lab
        run: sudo --preserve-env=CARGO_TARGET_TMPDIR timeout 3600 target/release/xtask leaktest --shard ${{ matrix.shard }}/4 --artifacts lab-out --capture-fixtures lab-out/fixtures

      - name: Make lab diagnostics readable
        if: always()
        run: |
          if [ -d lab-out ]; then
            sudo find lab-out -type d -exec chmod a+rx {} +
            sudo find lab-out -type f -exec chmod a+r {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaktest-${{ matrix.runner }}-shard-${{ matrix.shard }}
          path: lab-out
          retention-days: 14
          if-no-files-found: warn

  systemd-build:
    name: release binaries for systemd lab
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build release harness
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo build -p xtask --release --locked
      - name: Build release testing CLI and daemon
        # Only the existing boot checkpoints need testing. No lab-mutation.
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo build -p scupper -p scupperd --release --features testing --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-lab-binaries
          path: |
            target/release/xtask
            target/release/scupper
            target/release/scupperd
          if-no-files-found: error
          retention-days: 14

  systemd-lab:
    needs: systemd-build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
        # Each fault gets a fresh runner and a 20 minute internal deadline.
        # L9 point timings determine whether later runs need sharding.
        case: [L9, L10, L14, L44, V-13]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: systemd-lab-binaries
          path: target/systemd-bin
      - name: Install lab tools
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns ufw strace python3
          chmod +x target/systemd-bin/*
          sudo timeout 30 systemctl start systemd-udevd systemd-networkd
      - name: Run installed-unit case
        run: sudo timeout --kill-after=150 1380 target/systemd-bin/xtask systemd-lab --case ${{ matrix.case }} --binaries target/systemd-bin --artifacts systemd-lab-out
      - name: Report reboot module evidence
        if: always()
        env:
          LAB_RUNNER: ${{ matrix.runner }}
          LAB_CASE: ${{ matrix.case }}
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,LAB_RUNNER,LAB_CASE python3 - <<'PY'
          import json, os
          from pathlib import Path
          reports = sorted(Path('systemd-lab-out').rglob('reboot-modules.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"### Reboot modules: {os.environ['LAB_RUNNER']} / {os.environ['LAB_CASE']}\n\n")
              if not reports:
                  summary.write('No reboot module evidence collected; see case diagnostics.\n')
              for path in reports:
                  summary.write(f'{path}\n\n```json\n{json.dumps(json.loads(path.read_text()), indent=2)}\n```\n\n')
          PY
      - name: Unit test actual enabled ufw dumps in both UDP directions
        if: ${{ matrix.case == 'V-13' }}
        env:
          SCUPPER_TEST_UFW_DUMPS: ${{ github.workspace }}/systemd-lab-out
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo test -p scupper-sys --lib --locked install::firewall::tests::real_ufw_enable_ruleset_dumps -- --ignored --exact
      - name: Collect journal
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo timeout 30 journalctl --no-pager -o short-monotonic -u scupper-net -u scupperd | sudo tee systemd-lab-out/ci-journal.txt > /dev/null
      - name: Collect root egress kernel journal
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo timeout 30 journalctl --no-pager -k -o short-monotonic | sudo tee systemd-lab-out/ci-kernel-journal.txt > /dev/null
      - name: Make installed-unit diagnostics readable
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo find systemd-lab-out -type d -exec chmod a+rx {} +
          sudo find systemd-lab-out -type f -exec chmod a+r {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-lab-${{ matrix.runner }}-${{ matrix.case }}
          path: systemd-lab-out
          retention-days: 14
          if-no-files-found: error

  mutations:
    strategy:
      fail-fast: false
      matrix:
        mutation: [M-src, M-ct, M-out, M-probe]
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache mutation builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-mutations
      - name: Install lab tools
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns openssl python3
      - name: Build mutation lab and testing binaries
        run: |
          timeout 600 cargo build -p xtask --features lab-mutation --locked
          timeout 600 cargo build -p scupper -p scupperd --features testing,lab-mutation --locked
      - name: Require healthy control and expected mutant failure
        # xtask gives the control and mutant separate timeout 600 budgets.
        run: sudo --preserve-env=CARGO_TARGET_TMPDIR target/debug/xtask leaktest --mutation ${{ matrix.mutation }} --artifacts mutation-out
      - name: Make diagnostics readable
        if: always()
        run: |
          if [ -d mutation-out ]; then
            sudo find mutation-out -type d -exec chmod a+rx {} +
            sudo find mutation-out -type f -exec chmod a+r {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.runner }}-${{ matrix.mutation }}
          path: mutation-out
          retention-days: 14
          if-no-files-found: warn
