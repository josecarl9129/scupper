name: ci

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_TMPDIR: ${{ github.workspace }}/target/tmp
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # On lab/** branches only the leak lab and the no-feature build run; the full gate runs locally before every
  # lab push and again in CI on main.
  gate:
    name: fmt, clippy, test, doc, deny
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, cargo-deny and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked --force cargo-deny --version "${CARGO_DENY_VERSION}"
          fi

      - name: Format
        run: timeout 600 cargo fmt --all -- --check

      - name: Clippy
        run: timeout 600 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: timeout 600 cargo test --workspace --all-features --locked

      - name: Check nftables goldens without tunnel links
        run: |
          if ! command -v nft >/dev/null; then
            sudo timeout 300 apt-get update
            sudo timeout 300 apt-get install -y nftables
          fi
          mapfile -d '' files < <(find crates/*/tests/golden -type f \( -name '*.nft' -o -name '*.golden' \) -print0 | sort -z)
          (( ${#files[@]} >= 2 ))
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
            sudo timeout 30 unshare --net -- nft -c -f "$f"
          done

      - name: Doc
        run: timeout 600 cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Dependency policy
        run: timeout 600 cargo deny check

      - name: Default-feature build
        run: timeout 600 cargo build --workspace --locked

  production:
    name: shipped startup without testing feature
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy without testing
        run: timeout 600 cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests without testing
        run: timeout 600 cargo test --workspace --lib --bins --locked
      - name: Default-feature integration fencing
        run: |
          timeout 600 cargo test -p xtask --test mutation --locked
          timeout 600 cargo test -p scupper --test mutation --locked
          timeout 600 cargo test -p scupper-core --test verdict_v2 --locked default_build
      - name: Reject release mutation feature
        run: |
          if timeout 600 cargo build --release -p scupper-core --features lab-mutation --locked > release-mutation.log 2>&1; then
            cat release-mutation.log
            exit 1
          else
            release_status=$?
            cat release-mutation.log
            test "$release_status" -eq 101
            grep -Fq 'error: lab-mutation is restricted to debug lab builds' release-mutation.log
          fi
      - name: Release CLI and daemon
        run: timeout 600 cargo build -p scupper -p scupperd --release --locked
      - name: Verify testing hooks absent from release artifacts
        run: |
          for binary in scupper scupperd; do
            if grep -aEq 'SCUPPER_TEST_BOOT_POINT|SCUPPER_TEST_CA_DER|SCUPPER_TEST_ALERT_WINDOW_SECONDS|SCUPPER_LAB_MUTATION|injected boot stop' target/release/$binary; then
              echo "testing hook found in release $binary"
              exit 1
            fi
          done

  musl:
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and musl target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-musl

      - name: Install musl toolchain
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build musl release
        run: timeout 600 cargo build -p scupper -p scupperd --bins --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Verify static x86-64 executable
        run: |
          for binary in scupper scupperd; do
          description=$(file target/x86_64-unknown-linux-musl/release/$binary)
          printf '%s\n' "$description"
          [[ "$description" == *'ELF 64-bit LSB'* && "$description" == *'x86-64'* ]]
          [[ "$description" == *'statically linked'* || "$description" == *'static-pie linked'* ]]
            if grep -aEq 'SCUPPER_TEST_BOOT_POINT|SCUPPER_TEST_CA_DER|SCUPPER_TEST_ALERT_WINDOW_SECONDS|SCUPPER_LAB_MUTATION|injected boot stop' target/x86_64-unknown-linux-musl/release/$binary; then
              echo "testing hook found in musl $binary"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scupper-x86_64-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/scupper
            target/x86_64-unknown-linux-musl/release/scupperd
          retention-days: 14
          if-no-files-found: error

  leaktest:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install leak lab tools
        run: |
          # conntrack is required by boot when rebuilding an existing namespace.
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns openssl python3

      - name: Check shard budget using built-in duration estimates
        run: timeout 600 cargo test -p xtask --lib ci_shard_budget_uses_builtin_estimates_and_rejects_over_budget --locked

      - name: Build namespace lab
        run: timeout 600 cargo build -p xtask --release --locked

      - name: Build boot, check and probe testing CLI
        run: timeout 600 cargo build -p scupper -p scupperd --features testing --locked

      - name: Run boot-built namespace lab
        run: sudo --preserve-env=CARGO_TARGET_TMPDIR timeout 3600 target/release/xtask leaktest --shard ${{ matrix.shard }}/4 --artifacts lab-out --capture-fixtures lab-out/fixtures

      - name: Make lab diagnostics readable
        if: always()
        run: |
          if [ -d lab-out ]; then
            sudo find lab-out -type d -exec chmod a+rx {} +
            sudo find lab-out -type f -exec chmod a+r {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaktest-${{ matrix.runner }}-shard-${{ matrix.shard }}
          path: lab-out
          retention-days: 14
          if-no-files-found: warn

  systemd-build:
    name: release binaries for systemd lab
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build release harness
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo build -p xtask --release --locked
      - name: Build release testing CLI and daemon
        # Only the existing boot checkpoints need testing. No lab-mutation.
        run: timeout 600 env -u CARGO_TARGET_TMPDIR cargo build -p scupper -p scupperd --release --features testing --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-lab-binaries
          path: |
            target/release/xtask
            target/release/scupper
            target/release/scupperd
          if-no-files-found: error
          retention-days: 14

  systemd-lab:
    needs: systemd-build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
        # Each fault gets a fresh runner and a 20 minute internal deadline.
        # L9 point timings determine whether later runs need sharding.
        case: [L9, L10, L14, L44, V-13]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: systemd-lab-binaries
          path: target/systemd-bin
      - name: Install lab tools
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns ufw strace
          chmod +x target/systemd-bin/*
          sudo timeout 30 systemctl start systemd-udevd systemd-networkd
      - name: Run installed-unit case
        run: sudo timeout --kill-after=150 1380 target/systemd-bin/xtask systemd-lab --case ${{ matrix.case }} --binaries target/systemd-bin --artifacts systemd-lab-out
      - name: Collect journal
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo timeout 30 journalctl --no-pager -o short-monotonic -u scupper-net -u scupperd | sudo tee systemd-lab-out/ci-journal.txt > /dev/null
      - name: Collect root egress kernel journal
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo timeout 30 journalctl --no-pager -k -o short-monotonic | sudo tee systemd-lab-out/ci-kernel-journal.txt > /dev/null
      - name: Make installed-unit diagnostics readable
        if: always()
        run: |
          sudo mkdir -p systemd-lab-out
          sudo find systemd-lab-out -type d -exec chmod a+rx {} +
          sudo find systemd-lab-out -type f -exec chmod a+r {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-lab-${{ matrix.runner }}-${{ matrix.case }}
          path: systemd-lab-out
          retention-days: 14
          if-no-files-found: error

  mutations:
    strategy:
      fail-fast: false
      matrix:
        mutation: [M-src, M-ct, M-out, M-probe]
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache mutation builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-mutations
      - name: Install lab tools
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns openssl python3
      - name: Build mutation lab and testing binaries
        run: |
          timeout 600 cargo build -p xtask --features lab-mutation --locked
          timeout 600 cargo build -p scupper -p scupperd --features testing,lab-mutation --locked
      - name: Require healthy control and expected mutant failure
        # xtask gives the control and mutant separate timeout 600 budgets.
        run: sudo --preserve-env=CARGO_TARGET_TMPDIR target/debug/xtask leaktest --mutation ${{ matrix.mutation }} --artifacts mutation-out
      - name: Make diagnostics readable
        if: always()
        run: |
          if [ -d mutation-out ]; then
            sudo find mutation-out -type d -exec chmod a+rx {} +
            sudo find mutation-out -type f -exec chmod a+r {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.runner }}-${{ matrix.mutation }}
          path: mutation-out
          retention-days: 14
          if-no-files-found: warn
