name: ci

on:
  push:
    branches: [main, 'lab/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_TMPDIR: ${{ github.workspace }}/target/tmp
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # On lab/** branches only the leak lab runs; the full gate runs locally before every
  # lab push and again in CI on main.
  gate:
    name: fmt, clippy, test, doc, deny
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry, cargo-deny and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-deny
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked --force cargo-deny --version "${CARGO_DENY_VERSION}"
          fi

      - name: Format
        run: timeout 600 cargo fmt --all -- --check

      - name: Clippy
        run: timeout 600 cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: timeout 600 cargo test --workspace --all-features --locked

      - name: Check nftables goldens without tunnel links
        run: |
          if ! command -v nft >/dev/null; then
            sudo timeout 300 apt-get update
            sudo timeout 300 apt-get install -y nftables
          fi
          mapfile -d '' files < <(find crates/*/tests/golden -type f \( -name '*.nft' -o -name '*.golden' \) -print0 | sort -z)
          (( ${#files[@]} >= 2 ))
          for f in "${files[@]}"; do
            printf '%s\n' "$f"
            sudo timeout 30 unshare --net -- nft -c -f "$f"
          done

      - name: Doc
        run: timeout 600 cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Dependency policy
        run: timeout 600 cargo deny check

      - name: Default-feature build
        run: timeout 600 cargo build --workspace --locked

  production:
    name: shipped startup without testing feature
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Clippy without testing
        run: timeout 600 cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests without testing
        run: timeout 600 cargo test --workspace --lib --bins --locked
      - name: Release daemon
        run: timeout 600 cargo build -p scupperd --release --locked

  musl:
    if: ${{ !startsWith(github.ref, 'refs/heads/lab/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and musl target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-musl

      - name: Install musl toolchain
        run: |
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Build musl release
        run: cargo build -p scupper -p scupperd --bins --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Verify static x86-64 executable
        run: |
          for binary in scupper scupperd; do
          description=$(file target/x86_64-unknown-linux-musl/release/$binary)
          printf '%s\n' "$description"
          [[ "$description" == *'ELF 64-bit LSB'* && "$description" == *'x86-64'* ]]
          [[ "$description" == *'statically linked'* || "$description" == *'static-pie linked'* ]]
          done

      - uses: actions/upload-artifact@v4
        with:
          name: scupper-x86_64-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/scupper
            target/x86_64-unknown-linux-musl/release/scupperd
          retention-days: 14
          if-no-files-found: error

  leaktest:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # Lab branches run one runner to save CI minutes; main runs both.
        runner: ${{ startsWith(github.ref, 'refs/heads/lab/') && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install leak lab tools
        run: |
          # conntrack is required by boot when rebuilding an existing namespace.
          sudo timeout 300 apt-get update
          sudo timeout 300 apt-get install -y wireguard-tools nftables iproute2 tcpdump dnsmasq-base util-linux iputils-ping conntrack slirp4netns openssl

      - name: Build namespace lab
        run: timeout 600 cargo build -p xtask --release --locked

      - name: Build boot, check and probe testing CLI
        run: timeout 600 cargo build -p scupper -p scupperd --features testing --locked

      - name: Run boot-built namespace lab
        run: sudo timeout 1800 target/release/xtask leaktest --shard ${{ matrix.shard }}/4 --artifacts lab-out --capture-fixtures lab-out/fixtures

      - name: Make lab diagnostics readable
        if: always()
        run: |
          if [ -d lab-out ]; then
            sudo find lab-out -type d -exec chmod a+rx {} +
            sudo find lab-out -type f -exec chmod a+r {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaktest-${{ matrix.runner }}-shard-${{ matrix.shard }}
          path: lab-out
          retention-days: 14
          if-no-files-found: warn
