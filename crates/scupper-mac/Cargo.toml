[package]
name = "scupper-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []
qualification = ["testing", "scupper-darwin/qualification", "dep:socket2"]

[dependencies]
scupper-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
socket2 = { workspace = true, optional = true }
rustix = { workspace = true, features = ["time", "pipe"] }
scupper-darwin = { version = "0.1.4", path = "../scupper-darwin" }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
# Unit tests exercise the fake boundary under the ordinary cargo test command.
scupper-mac = { path = ".", features = ["testing"] }

[[bin]]
name = "scupper-mac-qual"
path = "src/bin/scupper-mac-qual.rs"
required-features = ["qualification"]
