allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Core may transform supplied data, but must not observe or mutate the host.
disallowed-types = [
    "std::process::Command",
    "std::process::Child",
    "std::fs::File",
    "std::fs::OpenOptions",
    "std::fs::DirBuilder",
    "std::fs::ReadDir",
    "std::fs::DirEntry",
    "std::fs::Metadata",
    "std::fs::FileType",
    "std::fs::Permissions",
    "std::fs::FileTimes",
    "std::net::TcpStream",
    "std::net::TcpListener",
    "std::net::UdpSocket",
    "std::os::unix::net::UnixStream",
    "std::os::unix::net::UnixListener",
    "std::os::unix::net::UnixDatagram",
]
disallowed-methods = [
    "std::fs::canonicalize",
    "std::fs::copy",
    "std::fs::create_dir",
    "std::fs::create_dir_all",
    "std::fs::exists",
    "std::fs::hard_link",
    "std::fs::metadata",
    "std::fs::read",
    "std::fs::read_dir",
    "std::fs::read_link",
    "std::fs::read_to_string",
    "std::fs::remove_dir",
    "std::fs::remove_dir_all",
    "std::fs::remove_file",
    "std::fs::rename",
    "std::fs::set_permissions",
    "std::fs::soft_link",
    "std::fs::symlink_metadata",
    "std::fs::write",
    "std::path::Path::canonicalize",
    "std::path::Path::exists",
    "std::path::Path::is_dir",
    "std::path::Path::is_file",
    "std::path::Path::is_symlink",
    "std::path::Path::metadata",
    "std::path::Path::read_dir",
    "std::path::Path::read_link",
    "std::path::Path::symlink_metadata",
    "std::path::Path::try_exists",
    "std::os::unix::fs::symlink",
    { path = "std::os::windows::fs::symlink_dir", allow-invalid = true },
    { path = "std::os::windows::fs::symlink_file", allow-invalid = true },
    "std::net::ToSocketAddrs::to_socket_addrs",
    "std::time::SystemTime::now",
    "std::time::Instant::now",
    "std::process::id",
    "std::process::exit",
    "std::process::abort",
    "std::env::current_dir",
    "std::env::current_exe",
    "std::env::temp_dir",
    "std::env::var",
    "std::env::var_os",
    "std::env::vars",
    "std::env::vars_os",
    "std::io::stdin",
    "std::io::stdout",
    "std::io::stderr",
    "std::thread::spawn",
    "std::thread::sleep",
]
