[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Unicode-3.0",
    "ISC", # ring, rustls-webpki and untrusted use the ISC licence.
    "BSD-3-Clause", # subtle uses the BSD three-clause licence.
    "CDLA-Permissive-2.0", # webpki-roots distributes Mozilla root certificate data.
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# ring pulls windows-sys 0.52; dns-lookup, socket2 and rustix pull 0.61.
skip = [{ crate = "windows-sys@0.52.0", reason = "ring pins 0.52; Windows-only" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
