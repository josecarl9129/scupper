# scupper is built only for Linux (gateway) and macOS (client); dependencies of other
# platforms (e.g. windows-sys) are out of scope for the policy checks.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
]

[advisories]
db-path = "target/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Unicode-3.0",
    "ISC", # ring, rustls-webpki and untrusted use the ISC licence.
    "BSD-3-Clause", # subtle uses the BSD three-clause licence.
    "CDLA-Permissive-2.0", # webpki-roots distributes Mozilla root certificate data.
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
