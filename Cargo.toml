[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
scupper-core = { version = "0.1.0", path = "crates/scupper-core" }
scupper-sys = { version = "0.1.0", path = "crates/scupper-sys" }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "thread", "rand"] }
thiserror = "2"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
dns-lookup = { version = "4", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
ipnet = { version = "2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
